name: Publish to npm

# 发布流程（认证走 npm Trusted Publishing / OIDC，全程不需要 NPM_TOKEN 或任何 secret）：
#   1. 改 package.json 的 version
#   2. git commit && git push
#   3. git tag v3.0.2 && git push origin v3.0.2
# 也可以在 Actions 页面点 "Run workflow" 手动触发（手动触发时不会做版本一致性校验）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# OIDC 可信发布必需：id-token: write 让 job 能向 npm 换取 OIDC 令牌
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # OIDC 可信发布要求 npm >= 11.5.1。Node 22 自带 npm 10.x 不满足，
          # Node 24 自带 npm 11.12+ 才够，所以这里锁 24.x。
          node-version: '24.x'
          # 不要加 registry-url！setup-node 会往 .npmrc 写入
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}，而本流程不提供该变量，
          # 写进去的空 token 会让 npm 放弃 OIDC 转而报 ENEEDAUTH。

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag            : $GITHUB_REF_NAME"
          echo "package.json   : $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json 的 $PKG 不一致，请先改 package.json 再打 tag"
            exit 1
          fi

      - name: 打印工具版本（排查失败时看这里）
        run: node -v && npm -v

      # 可信发布的 provenance 证明是全自动生成的，不需要 --provenance
      - name: 发布到 npm
        run: npm publish
