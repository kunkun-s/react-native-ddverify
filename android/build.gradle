
buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
    }
}
def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

apply plugin: 'com.android.library'
if (isNewArchitectureEnabled()) {
    apply plugin: 'com.facebook.react'
}

android {
    compileSdkVersion rootProject.hasProperty('compileSdkVersion') ? rootProject.compileSdkVersion : "30.0.2"
    buildToolsVersion  rootProject.hasProperty('buildToolsVersion') ? rootProject.buildToolsVersion : "30.0.2"
    namespace "com.dddverify"
    defaultConfig {
        minSdkVersion rootProject.hasProperty('minSdkVersion') ? rootProject.minSdkVersion : "21"
        targetSdkVersion rootProject.hasProperty('targetSdkVersion') ? rootProject.targetSdkVersion : "30"
        versionCode 1
        versionName "1.0"
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    }
    sourceSets {
        main {
            if (isNewArchitectureEnabled()) {
                java.srcDirs += ['src/newarch']
            } else {
                java.srcDirs += ['src/oldarch']
            }
        }
    }
    lintOptions {
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://repo1.maven.org/maven2/' }

}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    api fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    api 'com.umeng.umsdk:common:9.8.8'  // 必选
    api 'com.umeng.umsdk:asms:1.8.7.2'    // 必选
    implementation  'com.umeng.umsdk:uverify:4.0.0'// 必选
    implementation  'com.umeng.umsdk:uverify-main:2.2.3'// 必选
    implementation  'com.umeng.umsdk:uverify-logger:2.2.2'// 必选
    //noinspection GradleCompatible
    implementation 'com.android.support:appcompat-v7:27.1.1'
}
  