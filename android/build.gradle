
buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
    }
}
def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

//依赖方（App 工程）在根 build.gradle / gradle.properties 里定义的值优先，这里只提供兜底。
//原来的兜底值 "30.0.2" 既不是合法的 compileSdk 平台，也不是合法的 build-tools 版本，
//一旦 App 工程没有定义就会直接构建失败
def safeExtGet(prop, fallback) {
    return rootProject.hasProperty(prop) ? rootProject.getProperty(prop) : fallback
}

apply plugin: 'com.android.library'
if (isNewArchitectureEnabled()) {
    apply plugin: 'com.facebook.react'
}

android {
    compileSdkVersion safeExtGet('compileSdkVersion', 34)
    //buildToolsVersion 交给 AGP 自己决定（AGP 8.x 已不需要显式指定），App 工程显式指定时才跟随
    if (rootProject.hasProperty('buildToolsVersion')) {
        buildToolsVersion rootProject.getProperty('buildToolsVersion')
    }
    namespace "com.dddverify"
    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 21)
        targetSdkVersion safeExtGet('targetSdkVersion', 34)
        versionCode 1
        versionName "1.0"
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    }
    sourceSets {
        main {
            if (isNewArchitectureEnabled()) {
                java.srcDirs += ['src/newarch']
            } else {
                java.srcDirs += ['src/oldarch']
            }
        }
    }
    lintOptions {
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://repo1.maven.org/maven2/' }

}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    // api fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    api 'com.umeng.umsdk:common:9.8.8'  // 必选
    api 'com.umeng.umsdk:asms:1.8.7.2'    // 必选
    implementation  'com.umeng.umsdk:uverify:4.0.0'// 必选
    implementation  'com.umeng.umsdk:uverify-main:2.2.3'// 必选
    implementation  'com.umeng.umsdk:uverify-logger:2.2.2'// 必选
    //友盟授权页的 Activity（authsdk_activity_dialog 等）主题继承自 Theme.AppCompat.Light.NoActionBar，
    //所以 appcompat 是运行时必需的，不能删除。
    //这里必须用 AndroidX 坐标：RN 0.71+ 强制 AndroidX，旧的 support-v7 只能靠 jetifier 才能编译
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
  